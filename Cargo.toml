[workspace]
members = [
  "crates/falcondeck-core",
  "crates/falcondeck-daemon",
  "crates/falcondeck-relay",
  "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.lints.rust]

[workspace.lints.clippy]

[workspace.dependencies]
axum = { version = "0.8.4", features = ["macros", "ws"] }
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = "0.10.4"
futures-util = "0.3.31"
regex = "1.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tower-http = { version = "0.7.0", features = ["cors"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

# macOS defaults to unpacked debug info, which leaves one `.o` file per
# codegen unit. Across normal test/build feature combinations that grew this
# workspace's target directory past 100 GB. Line tables retain useful
# backtraces without the object-file explosion, and disabling incremental
# state keeps old compiler sessions from accumulating indefinitely.
[profile.dev]
debug = "line-tables-only"
incremental = false
split-debuginfo = "packed"

[profile.test]
debug = "line-tables-only"
incremental = false
split-debuginfo = "packed"

[profile.release]
lto = "thin"
codegen-units = 1
