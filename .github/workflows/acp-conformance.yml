name: ACP conformance

on:
  pull_request:
    paths:
      - '.github/workflows/acp-conformance.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/falcondeck-core/**'
      - 'crates/falcondeck-daemon/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/acp-conformance.yml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'crates/falcondeck-core/**'
      - 'crates/falcondeck-daemon/**'

permissions:
  contents: read

jobs:
  deterministic-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, pinned 2026-09-01
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Run deterministic ACP adapter checks
        run: cargo test -p falcondeck-daemon --test acp_conformance --locked
