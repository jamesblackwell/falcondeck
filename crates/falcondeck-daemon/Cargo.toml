[package]
name = "falcondeck-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
axum.workspace = true
base64 = "0.22.1"
chrono.workspace = true
falcondeck-core = { path = "../falcondeck-core" }
futures-util.workspace = true
keyring = "4.1.6"
regex.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
falcondeck-relay = { path = "../falcondeck-relay" }
tempfile = "3.23.0"
