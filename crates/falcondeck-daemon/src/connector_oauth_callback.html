<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#09090b">
  <title>__DOCUMENT_TITLE__</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0: #09090b;
      --bg-1: #111113;
      --bg-2: #1a1a1f;
      --fg-0: #f4f4f6;
      --fg-1: #c4c4cc;
      --fg-2: #9d9da8;
      --fg-3: #84848f;
      --border: rgba(255, 255, 255, 0.10);
      --accent: #34d399;
      --accent-muted: rgba(52, 211, 153, 0.14);
      --danger: #f87171;
      --danger-muted: rgba(248, 113, 113, 0.12);
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-full: 999px;
      --font: "Geist", "Inter", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      --mono: "Geist Mono", "SF Mono", "JetBrains Mono", ui-monospace, monospace;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg-0);
      color: var(--fg-0);
      font: 15px/1.5 var(--font);
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(24rem, 100%);
      text-align: center;
      animation: rise 150ms var(--ease) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
    }
    .pair {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 28px;
    }
    .tile {
      position: relative;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-lg);
      background: var(--bg-2);
      border: 1px solid var(--border);
      color: var(--fg-0);
      overflow: hidden;
    }
    .tile .letter {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 500;
      color: var(--fg-1);
    }
    .tile img {
      position: relative;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: var(--bg-2);
    }
    .tile:has(img) .letter {
      visibility: hidden;
    }
    .tile.falcon {
      display: grid;
      place-items: center;
      color: var(--fg-0);
    }
    .tile.falcon svg {
      width: 28px;
      height: 28px;
      display: block;
    }
    .tile.falcon svg path { fill: currentColor; }
    .status,
    .badge {
      display: grid;
      place-items: center;
      border-radius: var(--radius-full);
      flex-shrink: 0;
    }
    .status {
      width: 32px;
      height: 32px;
      background: var(--accent-muted);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .error .status {
      background: var(--danger-muted);
      color: var(--danger);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 36%, transparent);
    }
    .status svg,
    .badge svg {
      width: 16px;
      height: 16px;
      display: block;
    }
    .badge {
      width: 48px;
      height: 48px;
      margin: 0 auto 28px;
      background: var(--danger-muted);
      color: var(--danger);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 36%, transparent);
    }
    .ok .badge {
      background: var(--accent-muted);
      color: var(--accent);
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .badge svg {
      width: 22px;
      height: 22px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.25;
    }
    .body {
      margin: 0;
      color: var(--fg-2);
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .meta {
      margin: 24px 0 0;
      color: var(--fg-3);
      font-size: 12px;
      line-height: 1.5;
    }
    details {
      margin-top: 20px;
      color: var(--fg-3);
      font-size: 12px;
    }
    details ~ .meta {
      margin-top: 16px;
    }
    summary {
      cursor: pointer;
      color: var(--fg-2);
    }
    summary:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }
    pre {
      margin: 8px 0 0;
      text-align: left;
      padding: 12px;
      border-radius: var(--radius-md);
      background: var(--bg-2);
      border: 1px solid var(--border);
      color: var(--fg-2);
      font: 12px/1.55 var(--mono);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body class="__KIND__">
  <main>
    __PAIR__
    <h1>__TITLE__</h1>
    <p class="body">__BODY__</p>
    __DETAIL__
    <p class="meta">__META__</p>
  </main>
</body>
</html>
