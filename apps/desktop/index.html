<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#111113" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fbfbfc" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FalconDeck</title>
    <script>
      // Resolve the saved theme before any stylesheet lands so the boot
      // background matches; the app re-applies the full appearance on load.
      (() => {
        try {
          const raw = localStorage.getItem('fd-appearance')
          const theme = raw ? JSON.parse(raw).theme : 'system'
          const resolved =
            theme === 'light' || theme === 'dark'
              ? theme
              : matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = resolved
        } catch {
          // Keep the dark boot background.
        }
      })()
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
        /* Follow the theme tokens once they load; until then paint a boot
           colour for the resolved theme so nothing flashes black. */
        background: var(--fd-bg-0, #09090b);
        color: var(--fd-fg-0, #c4c4cc);
      }

      html[data-theme="light"],
      html[data-theme="light"] body,
      html[data-theme="light"] #root {
        background: var(--fd-bg-0, #f4f4f5);
        color: var(--fd-fg-0, #3f3f46);
      }

      .fd-startup {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 32px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      .fd-startup[data-error="true"] {
        color: #fda4af;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="fd-startup" data-fd-startup role="status">Starting FalconDeck…</div>
    </div>
    <script>
      (() => {
        const showStartupFailure = (reason) => {
          const status = document.querySelector('[data-fd-startup]')
          if (!(status instanceof HTMLElement)) return
          status.dataset.error = 'true'
          status.textContent = `FalconDeck could not start: ${String(reason || 'Unknown startup error')}`
        }

        window.addEventListener('error', (event) => showStartupFailure(event.message))
        window.addEventListener('unhandledrejection', (event) =>
          showStartupFailure(event.reason instanceof Error ? event.reason.message : event.reason),
        )
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
